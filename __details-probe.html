<!doctype html><meta charset=utf-8>
<style>
.lm-sec > .lm-body { display: none; }
.lm-sec[open] > .lm-body { display: block; }
@media (min-width: 1024px) {
  .lm-sec > .lm-body { display: block; }
  .lm-sec > summary { pointer-events: none; list-style: none; }
}
</style>
<details class="lm-sec">
  <summary>Charts</summary>
  <div class="lm-body" id="body"><p id="probe" style="height:80px;background:#cfc">CONTENT SHOULD BE VISIBLE AT >=1024px</p></div>
</details>
<pre id="out"></pre>
<script>
const el = document.getElementById('probe');
const r = el.getBoundingClientRect();
document.getElementById('out').textContent = JSON.stringify({
  innerWidth: window.innerWidth,
  bodyDisplay: getComputedStyle(document.getElementById('body')).display,
  probeRect: {w: r.width, h: r.height},
  offsetParentNull: el.offsetParent === null,
  clientHeight: el.clientHeight,
  checkVisibility: el.checkVisibility ? el.checkVisibility({contentVisibilityAuto:true, opacityProperty:true, visibilityProperty:true}) : 'n/a',
  detailsOpen: document.querySelector('details').open
}, null, 2);
</script>
